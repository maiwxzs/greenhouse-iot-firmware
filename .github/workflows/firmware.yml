# Corre las pruebas unitarias, compila el firmware para el Arduino Uno y
# construye la aplicación en cada push o pull request. El resultado se ve
# en la pestaña "Actions".
name: Firmware y aplicación

on:
  push:
    paths: ["firmware/**", "app/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "app/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache de PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Pruebas unitarias (lógica en el computador)
        run: pio test -e native

      - name: Compilar para Arduino Uno (con LCD)
        run: pio run -e uno

      - name: Compilar para Arduino Uno (sin LCD)
        run: pio run -e uno_sin_lcd

      - name: Uso de memoria
        run: |
          echo "### Memoria del Arduino Uno" >> "$GITHUB_STEP_SUMMARY"
          pio run -e uno -t size 2>&1 | grep -E "RAM:|Flash:" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

  aplicacion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir la aplicación
        run: npm run build

      - name: Tamaño de la aplicación
        run: |
          echo "### Aplicación" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
