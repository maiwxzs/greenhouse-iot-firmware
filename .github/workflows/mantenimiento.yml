name: Mantenimiento de referencias

on: workflow_dispatch

permissions:
  contents: write

jobs:
  referencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Etiquetas de versión sobre el historial actual y rama de prueba eliminada
        run: |
          git push origin --delete prueba-escritorio || true
          git tag -f v3.1.0 731977ca1d12db2293e414edbffe8995ba53b426
          git tag -f v3.1.1 6fee3a6d1bb9ebe73dcd35222457cc97ddf24655
          git push -f origin v3.1.0 v3.1.1
