# Construye la aplicación de escritorio para Windows (instalador .exe con Electron).
# - En cada cambio de app/ el instalador queda como artefacto de la ejecución (pestaña "Actions").
# - Al publicar una etiqueta vX.Y.Z, o al ejecutarlo a mano con una versión, se crea una versión
#   en "Releases" con el instalador adjunto.
name: Aplicación de escritorio

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/aplicacion.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", ".github/workflows/aplicacion.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (por ejemplo v3.1.0); vacío para solo construir"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir el instalador
        run: npm run instalador

      - name: Prueba de humo (abre la aplicación empaquetada)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Invernadero IoT.exe" -ArgumentList "--prueba" -PassThru -Wait -RedirectStandardOutput salida.txt
          Get-Content salida.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Tamaño del instalador
        shell: bash
        run: |
          echo "### Instalador de Windows" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/*.exe | awk '{print "    " $5 "  " $9}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Invernadero-IoT-Windows
          path: app/release/*.exe
          if-no-files-found: error

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/*.exe
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Invernadero IoT ${{ inputs.version || github.ref_name }}
          body: |
            Aplicación de escritorio para Windows 10 y 11 (64 bits).
            Descarga el archivo `.exe`, ábrelo y sigue el instalador. Guía completa en docs/manual-usuario.md.
