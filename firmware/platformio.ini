; Smart Greenhouse IoT — configuración de PlatformIO
;
;   Compilar:            pio run
;   Cargar al Arduino:   pio run -t upload
;   Monitor serie:       pio device monitor
;   Pruebas unitarias:   pio test -e native      (en el computador, sin Arduino)

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_echo = yes
monitor_eol = LF
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Misma placa, sin pantalla LCD (no necesita la librería LiquidCrystal_I2C)
[env:uno_sin_lcd]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_flags = -DUSAR_LCD=0
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Pruebas de la lógica (include/Logica.h) en el computador
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++11 -Wall -Wextra
